<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Page introuvable – Hiii</title>
  <!-- HIII – page 404 : quand l'adresse tapée n'existe pas (GitHub Pages l'affiche tout seul).
       Une seule page, sans fichier externe. Le texte change selon la langue du navigateur (fr / en). -->
  <style>
    :root { --fond: #F3F1FF; --texte: #17153A; --doux: #57547A; --violet: #4F46E5; --relief: #3730A3; }
    @media (prefers-color-scheme: dark) { :root { --fond: #100E29; --texte: #EFEEF9; --doux: #A9A6CB; --violet: #5850EC; --relief: #2E289A; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
           background: radial-gradient(40rem 30rem at 20% 0%, rgba(124,115,255,.25), transparent 60%), var(--fond);
           color: var(--texte); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
    .logo { font-size: 4.5rem; font-weight: 900; letter-spacing: -2px; margin: 0;
            background: linear-gradient(135deg, #4F46E5, #8B7BFF 55%, #FFD45C); -webkit-background-clip: text; background-clip: text; color: transparent; }
    h1 { font-size: 1.5rem; margin: 8px 0; }
    p { color: var(--doux); margin: 0 0 24px; line-height: 1.5; }
    a { display: inline-block; padding: 14px 26px; border-radius: 14px; background: var(--violet); color: #fff;
        font-weight: 700; text-decoration: none; box-shadow: 0 4px 0 var(--relief); }
    a:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--relief); }
  </style>
</head>
<body>
  <main>
    <p class="logo" aria-hidden="true">Hiii</p>
    <h1 id="titre">Oups, cette page n'existe pas.</h1>
    <p id="texte">L'adresse est peut-être mal tapée. Pas grave : on retourne à l'accueil ?</p>
    <a id="lien" href="./">Retour à l'accueil</a>
  </main>
  <script>
    // Un navigateur qui n'est pas en français → le texte en anglais
    if (!/^fr/i.test(navigator.language || "")) {
      document.documentElement.lang = "en";
      document.getElementById("titre").textContent = "Oops, this page doesn't exist.";
      document.getElementById("texte").textContent = "The address may be mistyped. No problem: back to the home page?";
      document.getElementById("lien").textContent = "Back to home";
      document.title = "Page not found – Hiii";
    }
    // Sur GitHub Pages, le site est dans /hiii-test/ : le lien ramène là
    var morceaux = location.pathname.split("/").filter(Boolean);
    if (location.hostname.endsWith("github.io") && morceaux.length) document.getElementById("lien").href = "/" + morceaux[0] + "/";
  </script>
</body>
</html>
